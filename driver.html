<style>

.ride-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ride-actions button{padding:14px 18px;font-weight:700;border-radius:8px;cursor:pointer}
.ride-actions button:disabled{opacity:.4;cursor:not-allowed}

.driver-container{
    max-width:900px;
    margin:0 auto;
    padding:30px 20px;
}

#driverMsg:empty{display:none}

#driverMsg{
    margin:20px 0;
    padding:16px 22px;
    border:3px solid #1677ff;
    border-radius:12px;
    background:#eef6ff;
    color:#075fd8;
    font-size:28px;
    font-weight:900;
    text-align:center;
    box-shadow:0 4px 12px rgba(22,119,255,.15);
}

#driverMsg:empty{
    display:none;
}

#requestList{
    margin-top:15px;
}

#requestList .card{
    margin-bottom:18px;
    padding:20px;
    background:white;
    border:1px solid #dfe5ec;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.rideAction{
    margin-top:10px;
    padding:13px 20px;
    border:none;
    border-radius:9px;
    background:#1677ff;
    color:white;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.location-card{
    margin-top:28px;
    padding:20px;
    background:white;
    border:1px solid #dfe5ec;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

#locationStatus{
    margin:15px 0;
    padding:13px 16px;
    background:#eefaf3;
    border:2px solid #16a34a;
    border-radius:10px;
    font-weight:800;
}

.location-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.start-location,
.stop-location{
    padding:13px 20px;
    color:white;
    border:none;
    border-radius:9px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.start-location{
    background:#1677ff;
}

.stop-location{
    background:#444;
}


/* =========================================================
   EMERGENCY SOS
========================================================= */

.emergency-card{
    margin-top:28px;
    padding:26px;
    background:#fff4f4;
    border:4px solid #d92d20;
    border-radius:18px;
    box-shadow:0 8px 24px rgba(217,45,32,.18);
    text-align:center;
}

.emergency-card h2{
    margin-top:0;
    margin-bottom:12px;
    color:#b42318;
    font-size:32px;
}

.emergency-warning{
    max-width:720px;
    margin:0 auto 18px;
    color:#7a271a;
    font-size:17px;
    line-height:1.6;
    font-weight:700;
}

.sos-button{
    width:100%;
    max-width:600px;
    padding:22px 26px;
    border:none;
    border-radius:16px;
    background:#d92d20;
    color:white;
    font-size:28px;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(217,45,32,.28);
}

.sos-button:hover{
    background:#b42318;
}

.sos-button:active{
    transform:scale(.99);
}

#sosResult{
    margin:20px auto 0;
    max-width:680px;
    padding:0;
    font-size:17px;
    line-height:1.6;
}

.sos-success{
    padding:20px;
    background:white;
    border:3px solid #d92d20;
    border-radius:14px;
    color:#7a271a;
}

.sos-map-link,
.call-911-button{
    display:inline-block;
    text-decoration:none;
    font-weight:900;
    border-radius:10px;
}

.sos-map-link{
    padding:12px 18px;
    background:#1677ff;
    color:white;
}

.call-911-button{
    padding:16px 26px;
    background:#d92d20;
    color:white;
    font-size:24px;
}

.emergency-note{
    margin-top:15px;
    color:#667085;
    font-size:14px;
    line-height:1.5;
}


/* =========================================================
   ABOUT FARE-RIDE
========================================================= */

.about-fareride{
    margin-top:32px;
    padding:26px;
    background:linear-gradient(135deg,#f8fbff,#eef6ff);
    border:2px solid #1677ff;
    border-radius:18px;
    box-shadow:0 6px 20px rgba(22,119,255,.12);
    text-align:center;
}

.about-fareride h2{
    margin-top:0;
    color:#075fd8;
    font-size:30px;
}

.creator{
    font-size:18px;
    font-weight:800;
    color:#475467;
}

.mission{
    max-width:760px;
    margin:16px auto;
    line-height:1.7;
    font-size:17px;
}

.driver-share{
    margin:22px auto;
    padding:18px;
    max-width:650px;
    background:#ffffff;
    border:3px solid #16a34a;
    border-radius:14px;
    color:#08783d;
    font-size:28px;
    font-weight:900;
}

.savings-line{
    margin:16px 0;
    color:#075fd8;
    font-size:22px;
    font-weight:900;
}

.join-box{
    margin:24px auto 0;
    padding:20px;
    max-width:650px;
    background:#ffffff;
    border:1px solid #cbd5e1;
    border-radius:14px;
}

.join-box a{
    display:inline-block;
    margin:6px 8px;
    padding:11px 16px;
    background:#1677ff;
    color:#ffffff;
    text-decoration:none;
    border-radius:9px;
    font-weight:900;
}

.join-box a.email{
    background:#16a34a;
}

.tagline{
    margin-top:20px;
    font-size:18px;
    font-weight:900;
}

@media(max-width:650px){

    .driver-container{
        padding:20px 12px;
    }

    #driverMsg{
        font-size:22px;
    }

    .location-buttons{
        flex-direction:column;
    }

    .location-buttons button{
        width:100%;
    }

    .driver-share{
        font-size:22px;
    }

    .emergency-card{
        padding:20px 14px;
    }

    .emergency-card h2{
        font-size:27px;
    }

    .sos-button{
        font-size:24px;
        padding:20px 16px;
    }

    .call-911-button{
        width:100%;
        font-size:22px;
    }
}


/* Center the primary job controls and use the full card width. */
section[aria-label="Driver job controls"] > h2,
#driverControlsStatus { text-align:center; }
#driverControls { width:100%; }
#driverControls .ride-actions {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  width:100%;
}
#driverControls .ride-actions button {
  width:100%;
  min-width:0;
  height:100%;
  margin:0;
  text-align:center;
  padding:12px 8px !important;
}
@media(max-width:480px) {
  #driverControls .ride-actions { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
</style>

<body class="app-shell app-button-upgrade yellow-app-panel driver-readable-text">
<div class="app-content-frame">

<header>

    <h1>
        FareRide Driver
    </h1>

    <nav id="driverPageLinks" aria-label="Driver navigation" style="display:flex;flex-wrap:wrap;gap:16px">
        <a href="index.html">Home</a>
        <a href="Receipts/driver-receipts.html">Receipts</a>
        <a href="driver-earnings.html">Complete &amp; Earning</a>
        <a href="driver-ratings.html">Rate your riders</a>
        <a href="about-fare-ride.html">About Fare-Ride</a>
    </nav>

</header>


<main class="driver-container">

<section class="card" aria-label="Driver job controls">
  <h2>Driver Job Controls</h2>
  <p id="driverControlsStatus">A ride request must load before these actions can be used.</p>
  <div id="driverMsg" role="status" aria-live="polite"></div>
  <div id="driverControls">
    <div class="ride-actions">
      <button type="button" disabled>Accept</button>
      <button type="button" disabled>Start Ride</button>
      <button type="button" disabled>Arrive at Pickup</button>
      <button type="button" disabled>Complete Ride</button>
    </div>
  </div>
</section>


<section id="jobChat" class="card" aria-label="Live job chat"></section>

<section aria-label="Available jobs">

    <div id="requestList">

        <div class="card">

            <p>
                Loading ride requests...
            </p>

        </div>

    </div>

</section>





<section class="location-card">

    <h3>
        Live Location Sharing
    </h3>

    <div id="locationStatus">
        Location shares automatically while signed in. Allow location access when prompted.
    </div>

</section>


<!-- ======================================================
     EMERGENCY SOS
======================================================= -->

<section class="emergency-card driver-sos-compact" aria-label="Emergency SOS">
    

    <div class="sos-services" role="group" aria-label="Choose SOS service">
      <button class="sos-service-button" type="button" data-sos-service="police" aria-label="Send Police SOS to FareRide Admin">
        <img class="sos-icon-animated" src="assets/sos-police.gif" width="24" height="18" alt="" aria-hidden="true">
        <img class="sos-icon-still" src="assets/sos-police.png" width="24" height="18" alt="" aria-hidden="true">
        <span>Police SOS</span>
      </button>
      <button class="sos-service-button" type="button" data-sos-service="ambulance" aria-label="Send Ambulance SOS to FareRide Admin">
        <img class="sos-icon-animated" src="assets/sos-ambulance.gif" width="24" height="18" alt="" aria-hidden="true">
        <img class="sos-icon-still" src="assets/sos-ambulance.png" width="24" height="18" alt="" aria-hidden="true">
        <span>Ambulance SOS</span>
      </button>
      
    </div>

    <div id="sosResult"></div>

</section>





</main>
</div>
