<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FareRide Rider</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#15191f}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 6vw;background:#fff;border-bottom:1px solid #ddd}
main{max-width:1100px;margin:auto;padding:40px 6vw}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0001}
label{display:grid;gap:8px;margin:16px 0}
input,select{padding:12px;border:1px solid #ccd3dc;border-radius:10px}
button{padding:12px 18px;border:0;border-radius:10px;background:#17b66b;color:#fff;font-weight:700}
a{text-decoration:none;color:inherit}
.map{min-height:360px;background:linear-gradient(135deg,#e6f3ec,#e2e9f5);border-radius:16px;display:grid;place-items:center;font-size:60px}
.msg{margin-top:14px;color:#0d8b50;font-weight:700}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>FareRide Rider</h1><a href="../index.html">Home</a></header>
<main>
<h2>Where are you going?</h2>
<p>Enter your pickup and destination.</p>
<div class="grid">
<form id="rideForm" class="card">
<label>Pickup<input id="pickup" required placeholder="Times Square, New York, NY"></label>
<label>Destination<input id="dropoff" required placeholder="JFK Airport, Queens, NY"></label>
<label>Ride type<select id="rideType"><option>Economy</option><option>Comfort</option><option>XL</option></select></label>
<p><strong>Temporary estimate:</strong> $24.80</p>
<button type="submit">Request FareRide</button>
<div id="msg" class="msg"></div>
</form>
<div class="card"><div class="map">🚗</div></div>
</div>
</main>
<script>
document.getElementById('rideForm').addEventListener('submit',e=>{
e.preventDefault();
document.getElementById('msg').textContent='Ride request saved locally for now. Real route pricing will be connected after Firebase is fixed.';
});
</script>
</body>
</html>
